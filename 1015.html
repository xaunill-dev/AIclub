<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GPS 位置回報系統</title>
  <!-- 引入 Tailwind CSS 以快速構建精美 UI -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 玻璃擬物化與深色科技感樣式 */
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
    }
    .input-field {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      transition: all 0.3s ease;
    }
    .input-field:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
      background: rgba(0, 0, 0, 0.4);
    }
    /* 載入動畫 Spinner */
    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      border-top: 3px solid #ffffff;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
      display: inline-block;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { 
      0% { transform: rotate(0deg); } 
      100% { transform: rotate(360deg); } 
    }
  </style>
</head>
<body class="p-4 sm:p-8">

  <div class="glass-card w-full max-w-md p-8 rounded-2xl">
    <div class="flex flex-col items-center mb-8">
      <!-- 裝飾性 Icon -->
      <div class="bg-blue-500/20 p-3 rounded-full mb-3 shadow-lg shadow-blue-500/20">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      </div>
      <h2 class="text-2xl font-bold tracking-wider text-gray-100">GPS 位置回報系統</h2>
    </div>

    <div class="space-y-6">
      <!-- 團隊編號 -->
      <div>
        <label for="teamCode" class="block text-sm font-medium text-gray-300 mb-1.5">團隊編號 <span class="text-red-400">*</span></label>
        <input type="text" id="teamCode" class="input-field w-full px-4 py-3 rounded-xl text-lg placeholder-gray-500" placeholder="例如: T-001" required>
      </div>

      <!-- 姓名暱稱 -->
      <div>
        <label for="name" class="block text-sm font-medium text-gray-300 mb-1.5">姓名暱稱 <span class="text-gray-500 text-xs">(選填)</span></label>
        <input type="text" id="name" class="input-field w-full px-4 py-3 rounded-xl text-lg placeholder-gray-500" placeholder="請輸入姓名或暱稱">
      </div>

      <!-- 送出按鈕 -->
      <button id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-bold py-3.5 px-4 rounded-xl transition-all duration-300 shadow-lg shadow-blue-500/30 flex justify-center items-center group">
        <span id="btnText" class="tracking-wide">取得位置並送出</span>
      </button>

      <!-- 狀態與訊息顯示區塊 -->
      <div id="statusMessage" class="text-center text-sm mt-4 hidden p-3 rounded-xl transition-all duration-300 font-medium"></div>
    </div>
  </div>

  <script>
    // ⚠️ 替換為您的 Google Apps Script Web App URL
    const API_URL = "在此填入您的_GAS_Web_App_網址"; 

    // DOM 元素選取
    const btn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const statusMsg = document.getElementById('statusMessage');
    const teamCodeInput = document.getElementById('teamCode');
    const nameInput = document.getElementById('name');

    // 1. 裝置識別 UUID 生成與儲存機制
    function getDeviceUUID() {
      let uuid = localStorage.getItem('device_uuid');
      if (!uuid) {
        // 若環境支援 crypto 則使用標準 API，否則使用降級方案 (Fallback)
        if (window.crypto && crypto.randomUUID) {
          uuid = crypto.randomUUID();
        } else {
          uuid = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
            const r = Math.random() * 16 | 0;
            const v = c === 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16);
          });
        }
        localStorage.setItem('device_uuid', uuid);
      }
      return uuid;
    }

    // 2. 獲取精準的亞洲/台北時間 (YYYY/MM/DD HH:MM)
    function getTaipeiTime() {
      const now = new Date();
      // 使用 Intl.DateTimeFormat 以確保時區正確，不受設備當前本地時區干擾
      const formatter = new Intl.DateTimeFormat('en-US', {
        timeZone: 'Asia/Taipei',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false // 24小時制
      });
      
      const parts = formatter.formatToParts(now);
      let year, month, day, hour, minute;
      
      parts.forEach(part => {
        if (part.type === 'year') year = part.value;
        if (part.type === 'month') month = part.value;
        if (part.type === 'day') day = part.value;
        if (part.type === 'hour') hour = part.value;
        if (part.type === 'minute') minute = part.value;
      });

      // 防呆：若時鐘格式化失敗（極少數舊瀏覽器），使用基本替換
      if (!year) {
         return now.toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' });
      }

      // 當時間是 24:00 時，修正為 00
      if (hour === '24') hour = '00';

      return `${year}/${month}/${day} ${hour}:${minute}`;
    }

    // 3. 狀態提示 UI 控制
    function setStatus(type, message) {
      statusMsg.classList.remove('hidden', 'bg-red-500/20', 'text-red-400', 'border-red-500/50', 
                                 'bg-green-500/20', 'text-green-400', 'border-green-500/50', 
                                 'bg-blue-500/20', 'text-blue-400', 'border-blue-500/50', 'border');
      
      statusMsg.classList.add('border'); // 共用 border 屬性

      if (type === 'error') {
        statusMsg.classList.add('bg-red-500/20', 'text-red-400', 'border-red-500/50');
      } else if (type === 'success') {
        statusMsg.classList.add('bg-green-500/20', 'text-green-400', 'border-green-500/50');
      } else if (type === 'info') {
        statusMsg.classList.add('bg-blue-500/20', 'text-blue-400', 'border-blue-500/50');
      }
      
      statusMsg.innerHTML = message;
    }

    // 控制按鈕狀態
    function setButtonState(state) {
      if (state === 'locating') {
        btn.disabled = true;
        btn.classList.add('opacity-70', 'cursor-not-allowed');
        btnText.innerHTML = '<span class="spinner"></span> 正在定位...';
      } else if (state === 'sending') {
        btn.disabled = true;
        btnText.innerHTML = '<span class="spinner"></span> 傳送資料中...';
      } else {
        btn.disabled = false;
        btn.classList.remove('opacity-70', 'cursor-not-allowed');
        btnText.innerHTML = '取得位置並送出';
      }
    }

    // 4. 按鈕點擊主流程
    btn.addEventListener('click', () => {
      const teamCode = teamCodeInput.value.trim();
      const name = nameInput.value.trim();

      // 檢查必填欄位
      if (!teamCode) {
        teamCodeInput.focus();
        setStatus('error', '❌ 錯誤：請輸入「團隊編號」');
        return;
      }

      // 檢查瀏覽器是否支援 Geolocation API
      if (!navigator.geolocation) {
        setStatus('error', '❌ 錯誤：您的瀏覽器不支援地理位置功能');
        return;
      }

      setButtonState('locating');
      setStatus('info', '📍 正在請求位置權限，請點擊「允許」...');

      // 請求位置資訊
      navigator.geolocation.getCurrentPosition(
        // 成功取得位置
        (position) => {
          // 精準至小數點後 6 位
          const lat = parseFloat(position.coords.latitude.toFixed(6));
          const lng = parseFloat(position.coords.longitude.toFixed(6));
          
          const payload = {
            teamCode: teamCode,
            name: name,
            uuid: getDeviceUUID(),
            latitude: lat,
            longitude: lng,
            timestamp: getTaipeiTime()
          };

          sendDataToGAS(payload);
        },
        // 取得位置失敗
        (error) => {
          setButtonState('reset');
          let errorMsg = '❌ 定位失敗：';
          switch(error.code) {
            case error.PERMISSION_DENIED: errorMsg += '您拒絕了位置權限'; break;
            case error.POSITION_UNAVAILABLE: errorMsg += '無法獲取位置資訊'; break;
            case error.TIMEOUT: errorMsg += '定位請求超時，請重試'; break;
            default: errorMsg += '發生未知錯誤'; break;
          }
          setStatus('error', errorMsg);
        },
        // Geolocation 選項
        {
          enableHighAccuracy: true, // 要求高精準度
          timeout: 10000,           // 10秒超時
          maximumAge: 0             // 不使用快取位置
        }
      );
    });

    // 5. 將 Payload 傳送至 Google Apps Script Web App
    function sendDataToGAS(payload) {
      setButtonState('sending');
      setStatus('info', '🚀 定位成功！正在傳送資料至伺服器...');

      fetch(API_URL, {
        method: 'POST',
        mode: 'no-cors', // ⚠️ 關鍵：GAS 跨域請求需要 no-cors
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      })
      .then(() => {
        /* 注意：
           在 `no-cors` 模式下，fetch 不會拋出 CORS 錯誤，但會返回 Opaque response。
           我們無法讀取 response.ok 或 HTTP status code。
           只要沒有觸發 catch 網路異常（如斷網），我們就預設視為送出成功。
        */
        setButtonState('reset');
        setStatus('success', '✅ 資料已成功送出！');
      })
      .catch(error => {
        setButtonState('reset');
        setStatus('error', '❌ 網路錯誤：資料傳送失敗，請檢查網路連線。');
        console.error('Fetch 錯誤:', error);
      });
    }
  </script>
</body>
</html>
